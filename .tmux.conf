unbind C-b
set -g prefix C-a
bind C-a send-prefix

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

bind -r H resize-pane -L 10
bind -r J resize-pane -D 10
bind -r K resize-pane -U 10
bind -r L resize-pane -R 10

bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

set -g base-index 1
set -g pane-base-index 1

set-window-option -g mode-keys vi

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'egel/tmux-gruvbox'

# Options to make tmux more pleasant
set -s set-clipboard on

set -g allow-passthrough on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# Overrides after tpm so they win over the theme plugin
set -g pane-border-style 'fg=#504945'
set -g pane-active-border-style 'fg=#fe8019,bold'

# Inactive panes washed out, active pane dark and clean
set -g window-style 'fg=#a89984,bg=#32302f'
set -g window-active-style 'fg=default,bg=#1d2021'

# Git branch of the focused pane's directory, ahead of the clock
set -g status-interval 5
set -g status-right "#[bg=colour237,fg=colour239,nobold,nounderscore,noitalics]#[bg=colour239,fg=#fe8019] #(git -C '#{pane_current_path}' symbolic-ref --quiet --short HEAD 2>/dev/null || git -C '#{pane_current_path}' rev-parse --short HEAD 2>/dev/null)#[bg=colour239,fg=colour246] %Y-%m-%d  %H:%M "

