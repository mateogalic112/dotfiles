unbind C-b
set -g prefix C-a
bind C-a send-prefix

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

bind -r H resize-pane -L 10
bind -r J resize-pane -D 10
bind -r K resize-pane -U 10
bind -r L resize-pane -R 10

bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

set-window-option -g mode-keys vi

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'egel/tmux-gruvbox'

# Options to make tmux more pleasant
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-ghostty:Tc"
set -s set-clipboard on

set -g allow-passthrough on

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# Overrides after tpm so they win over the theme plugin
set -g pane-border-style 'fg=#504945,bg=default'
set -g pane-active-border-style 'fg=#fe8019,bg=default,bold'
set -g status-style 'fg=#a89984,bg=default'
set -g status-position top
set -g status-right ''

# Inactive panes washed out via foreground only, so both stay
# transparent to Ghostty's background-opacity
set -g window-style 'fg=#d5c4a1,bg=default'
set -g window-active-style 'fg=default,bg=default'

